<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Amigo Residente">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3f9487">
<title>Amigo Residente</title>
<style>
:root{--bg:#F1F5F9;--c:#fff;--tx:#111827;--mu:#6b7280;--ln:#e3e8ef;--tl:#3f9487;--nv:#111827;--gr:#4caf50;--rd:#c8372d;--in:#fff;--tn:#f0faf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1520;--c:#18202e;--tx:#e8edf5;--mu:#98a2b3;--ln:#2a3447;--nv:#2f3b52;--in:#111826;--tn:#15302c}}
:root[data-theme=dark]{--bg:#0f1520;--c:#18202e;--tx:#e8edf5;--mu:#98a2b3;--ln:#2a3447;--nv:#2f3b52;--in:#111826;--tn:#15302c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,system-ui,sans-serif;padding-bottom:40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--c);z-index:10}
.top{padding:18px 20px;background:var(--c);border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:center;justify-content:space-between}
.top-l{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:13px;background:var(--tl);display:grid;place-items:center;flex-shrink:0}
.k{letter-spacing:.2em;font-size:11px;color:var(--tl);font-weight:700}h1{font-size:22px;margin:0}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);border-bottom:1px solid var(--ln);padding:12px 16px}
.pg{padding:16px}.mu{color:var(--mu);font-size:14px}.tl{color:var(--tl);font-size:14px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0f172a14}
.bed{display:flex;gap:12px;align-items:center;cursor:pointer}
.lb{background:var(--gr);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;white-space:nowrap}
.al{background:var(--rd);color:#fff;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pd{margin-top:10px;border:2px solid var(--rd);color:var(--rd);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.sec{font-size:13px;letter-spacing:.12em;color:var(--mu);font-weight:700;margin:0 0 8px;text-transform:uppercase}
label{display:block;font-size:14px;margin:10px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font:inherit;background:var(--in);color:var(--tx)}
textarea{min-height:100px;resize:vertical}
.b{border:0;border-radius:14px;padding:11px 15px;font:inherit;font-weight:600;cursor:pointer;background:var(--nv);color:#fff;transition:opacity .15s}
.t{background:var(--tl)}.g{background:var(--in);color:var(--mu);border:1px solid var(--ln)}.fw{width:100%;margin-top:8px}.b[disabled]{opacity:.45;cursor:not-allowed}
.ch{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:7px 13px;margin:0 6px 8px 0;font-size:14px;cursor:pointer;background:var(--in);user-select:none}
.ch.on{background:var(--tl);border-color:var(--tl);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:20}
.mod>div{background:var(--c);width:100%;max-width:560px;margin:auto;max-height:90vh;overflow:auto;padding:18px;border-radius:22px 22px 0 0}
.dash{border:2px dashed var(--ln);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center}.mc{padding:6px 11px;font-size:13px;white-space:nowrap}.rec{background:#dc2626!important;color:#fff!important;border-color:#dc2626!important;animation:pl 1s infinite}@keyframes pl{50%{opacity:.55}}.cE{border-left:5px solid #2563EB}.cP{border-left:5px solid #D97706}.cA{border-left:5px solid #0d9488}.cX{border-left:5px solid #7c3aed}
summary{cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 4px 12px #0004;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="md"></div>
<div id="toast" class="toast"></div>

<script>
const $=s=>document.querySelector(s),T=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),j=a=>a.join("");
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=o=>({id:Math.random().toString(36).slice(2),leito:"",nome:"",idade:"",sexo:"M",peso:"",hd:"",evol:"",plano:"",raw:"",pend:[],notas:"",ecog:null,v:{},atb:[],meds:[],lab:"",lb:{},alg:{n:0,i:[]},ex:{},resumo:"",day:T,...o});
const al=(...n)=>({n:0,i:n.map(x=>({n:x,r:[]}))});
const seed=()=>[
  mk({leito:"A2 04",nome:"J.A.S.",idade:78,hd:"Herpes Zóster complicado",alg:al("AINEs")}),
  mk({leito:"A2 07A",nome:"M.R.",idade:79,sexo:"F",hd:"Infecção urinária",alg:al("Dipirona")}),
  mk({leito:"A2 14A",nome:"O.N.",idade:91,sexo:"F",hd:"Broncopneumonia",alg:al("Penicilina"),pend:[{t:"Checar ecograma"},{t:"Checar Lab"}]}),
  mk({leito:"A3 03",nome:"L.R.",idade:52,sexo:"F",hd:"Cetoacidose diabética"}),
  mk({leito:"Z09 - Leito teste",nome:"Paciente teste",idade:68,peso:70,hd:"Hipótese teste"})
];

const EC=[
  ["ECOG 0 | PPS 100% | CFS 1-2 (Robusto)","Totalmente ativo, independente e sem restrições.","#e8f7f0","#2e7d5b"],
  ["ECOG 1 | PPS 80-90% | CFS 3 (Bem controlado)","Deambula normal e faz autocuidado, restrito apenas para atividade física extenuante.","#e8f7f0","#2e7d5b"],
  ["ECOG 2 | PPS 60-70% | CFS 4-5 (Vulnerável / Leve)","Deambula e faz autocuidado básico, mas incapaz de trabalhar (precisa de ajuda em tarefas instrumentais). Passa < 50% do dia no leito.","#fdf8e6","#a16207"],
  ["ECOG 3 | PPS 40-50% | CFS 6 (Frágil Moderado)","Autocuidado limitado (ajuda para banho/vestir). Passa > 50% do dia no leito ou poltrona.","#fdf1e3","#b45309"],
  ["ECOG 4 | PPS 20-30% | CFS 7-8 (Frágil Grave)","Restrito ao leito/poltrona (100% do tempo). Dependente total para autocuidado.","#fdecea","#b42318"],
  ["ECOG 4 | PPS 10% | CFS 9 (Terminalidade)","Fase final de vida / sonolento, cuidados exclusivos de conforto.","#f1eefc","#6d28d9"]
];

const EX=[
  ["Geral","Exame Geral e Perfusão","LOTE|BEG|REG|MEG|Descorado|Desidratado|Ictérico|Acianótico|Febril|TEC lentificado >3s","LOTE|BEG|Acianótico"],
  ["Respiratório","Exame Respiratório","Eupneico|Taquipneico|Uso de musculatura acessória|MV presentes|Sem ruídos adventícios|Crepitação fina|Crepitação grossa|Sibilos|Roncos|Em bases|Em terço médio|Apicais|Difusos|À direita|À esquerda","Eupneico|MV presentes|Sem ruídos adventícios"],
  ["Cardíaco","Exame Cardíaco e Volemia","RCI 2T|BNF|Sem sopros|Arritmia|Sopro sistólico|Sopro diastólico|Turgência jugular","RCI 2T|BNF|Sem sopros"],
  ["Abdome","Exame Abdome","Plano|Globoso|Flácido|RHA presentes|RHA ausentes|Timpânico|Indolor|Doloroso palpação superficial|Doloroso palpação profunda|Descompressão brusca +|Hepatomegalia|QSD|QSE|QID|QIE|Epigástrio|Mesogástrio|Hipogástrio|Fossa Ilíaca Dir.|Fossa Ilíaca Esq.","Plano|Flácido|RHA presentes|Indolor"],
  ["Extremidades","Exame Extremidades","Bem perfundidas|Sem edema|Edema +/4|Edema ++/4|Edema +++/4|Cacifo +|MID|MIE|MSD|MSE|Bilateral|Panturrilhas livres|Empastamento|Pulsos presentes","Bem perfundidas|Sem edema|Panturrilhas livres|Pulsos presentes"],
  ["Neuro","Exame Neurológico","Lúcido|Orientado|Confuso|Sonolento|Torporoso|Comatoso|Pupilas isocóricas|Fotorreagentes|Sem déficit focal|Déficit motor focal","Lúcido|Orientado|Pupilas isocóricas|Fotorreagentes|Sem déficit focal"]
];

const LABS=[
  ["hb","Hb (g/dL)"],["ht","Ht (%)"],["leuco","Leucócitos"],["plaq","Plaquetas"],
  ["cr","Creatinina"],["ur","Ureia"],["na","Sódio (Na)"],["k","Potássio (K)"],
  ["pcr","PCR"],["lact","Lactato"],["inr","INR"],["tgo","TGO/TGP"]
];

const O2=["Ar ambiente","Cateter 2L","Cateter 3L","Máscara 5L","Máscara reservatório","VNI","IOT/VM"],
      AGT=["Dipirona","AINEs","Penicilina","Sulfa","Látex","Contraste"],
      RX=["Cutânea/Urticária","Broncoespasmo","Anafilaxia/Grave"],
      QK=["Checar Lab","Reavaliar BH/Diurese","Checar Cultura","Solicitar Parecer","Ajustar ATB"];

const TT={id:"Identificação",ecog:"Status Basal e Funcionalidade (ECOG / PPS / CFS)",atb:"Prescrição e Antibióticos",lab:"🧪 Exames Laboratoriais",alg:"Alergias",cfg:"⚙️ Configurar IA (Gemini API)"};

let S,cur=null,dirty=false,mod=null,exo=true,files=[],recField=null,recObj=null;
const KEY="ar_v1";

function msg(t){const el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2600)}

const ro=p=>{
  if(!p.lb)p.lb={};
  if(p.day==T)return;
  if(p.evol||p.plano)p.prev={d:p.day,evol:p.evol,plano:p.plano};
  p.pend=p.pend.filter(x=>!x.ok);
  Object.assign(p,{evol:"",plano:"",raw:"",resumo:"",v:{},ex:{},ev:false,day:T});
};

try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}
if(!S||!S.pts)S={pts:seed(),apiKey:""};
S.pts.forEach(ro);

const pst=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
const D=()=>{dirty=true;const b=$("#sb");if(b)b.disabled=false},F=(k,x)=>{cur[k]=x;D()},V=(k,x)=>{cur.v[k]=x;D()},LB=(k,x)=>{if(!cur.lb)cur.lb={};cur.lb[k]=x;D()};
const dn=d=>Math.max(1,Math.floor((new Date(T)-new Date(d||T))/864e5)+1);

function expBk(){
  const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download=`censo-amigo-residente-${T}.json`;
  a.click();
  msg("Backup salvo nos seus downloads!");
}
function impBk(inp){
  const f=inp.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d&&Array.isArray(d.pts)){S=d;pst();R();msg("Backup restaurado com sucesso!");}
      else alert("Arquivo inválido.");
    }catch(err){alert("Erro ao ler backup.");}
  };
  r.readAsText(f);
}

function mic(k){
  const isRec = recField===k;
  return `<button type="button" class="b g mc ${isRec?'rec':''}" onclick="toggleMic('${k}')">${isRec?'⏹ Parar':'🎤 Voz'}</button>`;
}

function toggleMic(k){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){msg("Reconhecimento de voz não suportado neste navegador.");return;}
  if(recObj){recObj.stop();return;}
  recObj = new SR();
  recObj.lang = "pt-BR";
  recObj.continuous = false;
  recObj.interimResults = false;
  recField = k;
  R();
  recObj.onresult = ev => {
    const txt = ev.results[0][0].transcript;
    if(k==="pi"){
      const inp = $("#pi");
      if(inp) inp.value = (inp.value ? inp.value + " " : "") + txt;
    } else {
      cur[k] = (cur[k] ? cur[k] + " " : "") + txt;
      D();
    }
  };
  recObj.onend = () => { recField=null; recObj=null; R(); };
  recObj.onerror = () => { recField=null; recObj=null; R(); msg("Erro ao captar áudio."); };
  recObj.start();
}

function R(){const y=scrollY;$("#app").innerHTML=cur?P():C();scrollTo(0,y)}

function C(){
  return `<div class=top><div class=top-l><div class=logo><svg width=26 height=26 viewBox="0 0 24 24" fill=none stroke=#fff stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div><div><div class=k>AMIGO RESIDENTE</div><h1>Censo da Enfermaria</h1></div></div><button class="b g mc" onclick="M('cfg')" title="Configurar Chave Gemini">⚙️ IA</button></div>
  <div class=pg><h2 style="margin:6px 0 2px">Pacientes internados</h2><div class=mu>Visão rápida para a visita médica</div>
  <div class=row style="margin:14px 0"><span class=ch style="margin:0">${S.pts.length} leitos</span><button class="b t" onclick=AL()>＋ Adicionar leito</button></div>
  ${j(S.pts.map(p=>{
    const n=p.pend.filter(x=>!x.ok);
    return `<div class=card onclick="O('${p.id}')"><div class=bed><span class=lb style="${p.ev?"":"background:#cbd5e1;color:#64748b"}" onclick="event.stopPropagation();TG('${p.id}')">${p.ev?"✓ ":""}${e(p.leito)}</span><div style="flex:1;min-width:0"><b>${e(p.nome)}</b><div class=mu>${p.idade?p.idade+" anos":"Sem idade"}</div><div class=mu style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e(p.hd)}</div></div>${p.alg.i.length?`<span class=al>⚠ ALERGIA</span>`:""}<span class=mu>›</span></div>${n.length?`<div class=pd>⚠ ${n.length} PENDÊNCIA${n.length>1?"S":""} · ${e(n[0].t)}</div>`:""}</div>`
  }))}
  <div class=row style="justify-content:center;margin-top:20px">
    <button class="b g mc" onclick="expBk()">📥 Salvar Backup</button>
    <label class="b g mc" style="margin:0;cursor:pointer">📤 Restaurar<input type=file accept=".json" hidden onchange="impBk(this)"></label>
  </div>
  <p class=mu style="text-align:center;margin-top:10px">Dados salvos localmente neste aparelho</p></div>`;
}

function P(){
  const p=cur,v=p.v,pr=p.prev,vi=(k,l)=>`<div><div class=mu>${l}</div><input inputmode=decimal value="${e(v[k])}" oninput="V('${k}',this.value)"></div>`;
  return `<div class=hd><div class=row style="justify-content:space-between"><a class=mu onclick=bk() style="cursor:pointer">← Voltar ao censo</a><button class="b g mc" onclick="M('cfg')">⚙️ IA</button></div><div class=row style="margin-top:8px"><span class=lb style="background:var(--nv)">${e(p.leito)}</span><div style="flex:1;min-width:0"><b>${e(p.nome)||"Paciente"}</b><div class=mu>${p.idade?p.idade+" anos":"—"} ${p.peso?"· "+p.peso+"kg":""}</div><div class=tl style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e(p.hd)}</div></div><button class="b g" onclick="M('id')">✎</button><button id=sb class="b t" onclick=SV() ${dirty?"":"disabled"}>Salvar</button></div></div>
  <div class=pg>
  ${pr?`<details class=card><summary><b>Ontem (${pr.d.split("-").reverse().join("/")})</b></summary><p class=mu><b>Evolução:</b> ${e(pr.evol)||"—"}</p><p class=mu><b>Condutas:</b> ${e(pr.plano)||"—"}</p></details>`:""}
  <div class="card cE"><p class=sec style="color:#2563EB">📝 Evolução</p>
    <div style="background:#F8FAFC;border:1px solid #BFDBFE;border-radius:18px;padding:12px;color:#0f172a"><div class=row style="justify-content:space-between"><label style="margin:0">Anotação do Dia (Evolução / Subjetivo)</label>${mic("evol")}</div><textarea id=t_evol oninput="F('evol',this.value)" placeholder="Como o paciente passou nas últimas 24h, queixas, impressão clínica...">${e(p.evol)}</textarea></div>
    <div style="background:#ECFDF5;border:1px solid #6EE7B7;border-radius:18px;padding:12px;margin-top:14px;color:#0f172a"><div class=row style="justify-content:space-between"><label style="margin:0;color:#065F46;font-weight:700">Plano Terapêutico (Condutas do Dia)</label>${mic("plano")}</div><textarea id=t_plano oninput="F('plano',this.value)" placeholder="Condutas definidas hoje: ajuste de ATB, exames solicitados, metas de diurese/pressão...">${e(p.plano)}</textarea></div>
    <details class=dash style="display:block;margin-top:14px" ${p.raw?"open":""}><summary style="color:var(--tx)">Dados Brutos / OCR do Prontuário <span class=mu style="float:right">${p.raw?"preenchido":"vazio"}</span></summary>
      <label class=dash style="justify-content:center">📷 Fotografar prontuário / exames <span id=fc style="margin-left:8px;font-weight:700;color:var(--tl)">${files.length?`(${files.length} foto${files.length>1?'s':''})`:""}</span><input type=file accept="image/*" capture=environment multiple hidden onchange="pk(this)"></label>
      <button id="btn_trs" class="b g fw" onclick="trs()">✨ Transcrever Fotos com IA</button>
      <textarea id="t_raw" style="margin-top:8px" oninput="F('raw',this.value)" placeholder="Cole aqui o prontuário do dia ou use “Transcrever Fotos”...">${e(p.raw)}</textarea>
    </details>
  </div>

  <div class="card cP"><p class=sec style="color:#D97706">📌 Pendências</p>
    <div class=row><input id=pi placeholder="Tarefa rápida..." onkeydown="if(event.key=='Enter')PA()">${mic("pi")}<button class=b onclick="PA()" style="white-space:nowrap">＋ Add</button></div>
    <div style="margin-top:10px">${j(QK.map((q,i)=>`<span class=ch style="background:${i%2?"#EFF6FF":"#FEF3C7"};border-color:${i%2?"#93C5FD":"#FCD34D"};color:${i%2?"#1D4ED8":"#92400E"};font-weight:600" onclick="PA('${q}')">+ ${q}</span>`))}</div>
    ${j(p.pend.map((x,i)=>`<div class=row style="margin:6px 0"><input type=checkbox style="width:22px;height:22px" ${x.ok?"checked":""} onchange="PK(${i})"><span style="flex:1;${x.ok?"text-decoration:line-through;opacity:.5":""}">${e(x.t)}</span><button class="b g" onclick="PX(${i})">✕</button></div>`))}
    <div class=row style="justify-content:space-between;margin-top:8px"><label style="margin:0">Notas e observações</label>${mic("notas")}</div>
    <textarea id=t_notas oninput="F('notas',this.value)" placeholder="Liste tarefas, exames pendentes e itens a checar no próximo plantão...">${e(p.notas)}</textarea>
  </div>

  <div class="card cA"><p class=sec style="color:#0d9488">📊 Parâmetros e Controles</p>
    <div onclick="M('ecog')" style="border:2px solid ${p.ecog==null?"var(--ln)":EC[p.ecog][3]};background:${p.ecog==null?"var(--in)":EC[p.ecog][2]};color:${p.ecog==null?"var(--mu)":EC[p.ecog][3]};border-radius:16px;padding:14px;cursor:pointer;font-weight:600">${p.ecog==null?"Status basal: ECOG / PPS / CFS (toque para escolher)":EC[p.ecog][0]}</div>
    <h3 style="margin:16px 0 6px">Sinais Vitais</h3>
    <div class=g3>${vi("fc","FC (bpm)")}${vi("pas","PAS (mmHg)")}${vi("pad","PAD (mmHg)")}${vi("fr","FR (irpm)")}${vi("sat","SatO2 (%)")}${vi("temp","Temp (°C)")}</div>
    <div style="margin-top:8px"><div><div class=mu>Suporte de O2</div><select onchange="V('o2',this.value)">${j(O2.map(o=>`<option ${v.o2==o?"selected":""}>${o}</option>`))}</select></div></div>
    <div class=g3 style="margin-top:8px">${vi("hgt","HGT (mg/dL)")}${vi("diu","Diurese (ml)")}${vi("bh","BH 24h (ml)")}</div>
    <div class=dash style="background:#EFF6FF;border:2px solid #60A5FA;color:#1D4ED8;font-weight:600" onclick="M('atb')"><span>💊 Prescrição e Antibióticos${j(p.atb.filter(a=>a.n).map(a=>`<div style="font-size:13px;font-weight:500">${e(a.n)} · D${dn(a.ini)}/${a.dias}</div>`))}</span><span>›</span></div>
    <div class=dash style="background:#F5F3FF;border:2px solid #A78BFA;color:#6D28D9;font-weight:600" onclick="M('lab')"><span>🧪 Exames Laboratoriais${p.lab||Object.values(p.lb||{}).some(Boolean)?" ✓":""}</span><span>›</span></div>
