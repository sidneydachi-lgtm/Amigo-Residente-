<style>

body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,system-ui,sans-serif;padding-bottom:40px}
.top{padding:18px 20px;background:var(--c);border-bottom:1px solid var(--ln);display:flex;gap:12px;align-items:center;justify-content:space-between}
.top-l{display:flex;gap:12px;align-items:center}
.logo{width:46px;height:46px;border-radius:13px;background:var(--tl);display:grid;place-items:center;flex-shrink:0}
.k{letter-spacing:.2em;font-size:11px;color:var(--tl);font-weight:700}h1{font-size:22px;margin:0}
.hd{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--ln);padding:12px 16px}

.pd{margin-top:10px;border:2px solid var(--rd);color:var(--rd);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.sec{font-size:13px;letter-spacing:.12em;color:var(--mu);font-weight:700;margin:0 0 8px;text-transform:uppercase}
label{display:block;font-size:14px;margin:10px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font:inherit;background:var(--in);color:var(--tx)}
textarea{min-height:100px;resize:vertical}
.b{border:0;border-radius:14px;padding:11px 15px;font:inherit;font-weight:600;cursor:pointer;background:var(--nv);color:#fff}
.t{background:var(--tl)}.g{background:var(--in);color:var(--mu);border:1px solid var(--ln)}.fw{width:100%;margin-top:8px}.b[disabled]{opacity:.45}
.ch{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:7px 13px;margin:0 6px 8px 0;font-size:14px;cursor:pointer;background:var(--in)}
.ch.on{background:var(--tl);border-color:var(--tl);color:#fff}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:20}
.mod>div{background:var(--c);width:100%;max-width:560px;margin:auto;max-height:90vh;overflow:auto;padding:18px;border-radius:22px 22px 0 0}
.dash{border:2px dashed var(--ln);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center}.mc{padding:6px 11px;font-size:13px;white-space:nowrap}.rec{background:#dc2626!important;color:#fff!important;animation:pl 1s infinite}@keyframes pl{50%{opacity:.55}}.cE{border-left:5px solid #2563EB}.cP{border-left:5px solid #D97706}.cA{border-left:5px solid #0d9488}.cX{border-left:5px solid #7c3aed}
summary{cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nv);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>
<body>

function P(){const p=cur,v=p.v,pr=p.prev,vi=(k,l)=>`<div><div class=mu>${l}</div><input inputmode=decimal value="${e(v[k])}" oninput="V('${k}',this.value)"></div>`;
return`<div class=hd><div class=row style="justify-content:space-between"><a class=mu onclick=bk() style="cursor:pointer">← Voltar ao censo</a><button class="b g mc" onclick="M('cfg')">⚙️ IA</button></div><div class=row style="margin-top:8px"><span class=lb style="background:var(--nv)">${e(p.leito)}</span><div style="flex:1;min-width:0"><b>${e(p.nome)||"Paciente"}</b><div class=mu>${p.idade?p.idade+" anos":""}</div><div class=tl style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e(p.hd)}</div></div><button class="b g" onclick="M('id')">✎</button><button id=sb class="b t" onclick=SV() ${dirty?"":"disabled"}>Salvar</button></div></div><div class=pg>${pr?`<details class=card><summary><b>Ontem (${pr.d.split("-").reverse().join("/")})</b></summary><p class=mu>${e(pr.evol)}</p></details>`:""}<div class="card cE"><p class=sec style="color:#2563EB">📝 Evolução</p><div style="background:#F8FAFC;border:1px solid #BFDBFE;border-radius:18px;padding:12px"><div class=row style="justify-content:space-between"><label style="margin:0">Evolução 24h</label>${mic("evol")}</div><textarea oninput="F('evol',this.value)" placeholder="Queixas, exame clínico...">${e(p.evol)}</textarea></div><div style="background:#ECFDF5;border:1px solid #6EE7B7;border-radius:18px;padding:12px;margin-top:14px"><div class=row style="justify-content:space-between"><label style="margin:0;color:#065F46">Condutas do Dia</label>${mic("plano")}</div><textarea oninput="F('plano',this.value)" placeholder="Condutas...">${e(p.plano)}</textarea></div><details class=dash style="display:block;margin-top:14px" ${p.raw?"open":""}><summary>OCR / Prontuário</summary><label class=dash style="justify-content:center">📷 Fotografar <span id=fc></span><input type=file accept="image/*" capture=environment multiple hidden onchange="pk(this)"></label><button id=btn_trs class="b g fw" onclick="trs()">✨ Transcrever com IA</button><textarea oninput="F('raw',this.value)">${e(p.raw)}</textarea></details></div><div class="card cP"><p class=sec style="color:#D97706">📌 Pendências</p><div class=row><input id=pi placeholder="Tarefa..." onkeydown="if(event.key=='Enter')PA()">${mic("pi")}<button class=b onclick="PA()">＋ Add</button></div><div style="margin-top:10px">${j(QK.map((q,i)=>`<span class=ch style="background:${i%2?"#EFF6FF":"#FEF3C7"};color:${i%2?"#1D4ED8":"#92400E"}" onclick="PA('${q}')">+ ${q}</span>`))}</div>${j(p.pend.map((x,i)=>`<div class=row style="margin:6px 0"><input type=checkbox style="width:22px;height:22px" ${x.ok?"checked":""} onchange="PK(${i})"><span style="flex:1;${x.ok?"text-decoration:line-through;opacity:.5":""}">${e(x.t)}</span><button class="b g" onclick="PX(${i})">✕</button></div>))}</div><div class="card cA"><p class=sec style="color:#0d9488">📊 Parâmetros</p><div onclick="M('ecog')" style="border:2px solid ${p.ecog==null?"var(--ln)":EC[p.ecog][3]};background:${p.ecog==null?"var(--in)":EC[p.ecog][2]};border-radius:16px;padding:14px;cursor:pointer;font-weight:600">${p.ecog==null?"Status basal: ECOG / PPS / CFS":EC[p.ecog][0]}</div><h3 style="margin:16px 0 6px">Sinais Vitais</h3><div class=g3>${vi("fc","FC")}${vi("pas","PAS")}${vi("pad","PAD")}${vi("fr","FR")}${vi("sat","SatO2")}${vi("temp","Temp")}</div><div style="margin-top:8px"><select onchange="V('o2',this.value)">${j(O2.map(o=>`<option ${v.o2==o?"selected":""}>${o}</option>`))}</select></div><div class=g3 style="margin-top:8px">${vi("hgt","HGT")}${vi("diu","Diurese")}${vi("bh","BH 24h")}</div><div class=dash onclick="M('atb')"><span>💊 Antibióticos</span>›</div><div class=dash onclick="M('lab')"><span>🧪 Exames</span>›</div><div class=dash onclick="M('alg')"><span>⚠️ Alergias</span>›</div></div><div class="card cX"><div class=row style="justify-content:space-between"><p class=sec style="margin:0;color:#7c3aed">🩺 Exame Físico</p><button class="b g mc" onclick="exo=!exo;R()">${exo?"Recolher":"Expandir"}</button></div>${exo?j(EX.map((x,i)=>{const s=p.ex[x[0]]||[],nm=x[3].split("|"),on=s.length==nm.length&&nm.ev const O=id=>{cur=S.pts.find(p=>p.id==id);files=[];dirty=false;R();scrollTo(0,0)},bk=()=>{pst();cur=null;dirty=false;R();scrollTo(0,0)},SV=()=>{pst();dirty=false;const b=$("#sb");if(b)b.disabled=true;msg("Salvo!")},M=x=>{mod=x||null;MR();if(!x)R()};
